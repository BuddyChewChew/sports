name: FutbolX Playlist & EPG

on:
  schedule:
    # Every 15 minutes - event schedules and stream URLs change frequently
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "futbolx/generate.py"
      - ".github/workflows/futbolx.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run generator
        run: python futbolx/generate.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add futbolx/futbolx.m3u8 futbolx/futbolx_epg.xml.gz
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update FutbolX playlist and EPG [skip ci]"
            git push
          fi
